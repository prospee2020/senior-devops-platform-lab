apiVersion: apps/v1
kind: Deployment
metadata:
  name: senior-devops-api
  labels:
    app.kubernetes.io/name: senior-devops-api
    app.kubernetes.io/part-of: senior-devops-platform-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: senior-devops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: senior-devops-api
    spec:
      # Pod-level security: default-deny syscall filtering for every container.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          # Tag is intentionally a placeholder; overlays pin the real tag.
          image: senior-devops-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: senior-devops-api-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
