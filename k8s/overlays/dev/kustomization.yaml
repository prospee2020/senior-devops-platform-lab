apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The dev overlay demonstrates the three canonical overlay changes —
# replicas, image tag, configuration — WITHOUT touching base/.

namespace: dev

resources:
  - ../../base

replicas:
  - name: senior-devops-api
    count: 2

images:
  - name: senior-devops-api
    newTag: dev

patches:
  - path: patch-configmap.yaml
